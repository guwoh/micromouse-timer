name: Build desktop app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: MicromouseTimer-linux
            archive: MicromouseTimer-linux.tar.gz
            installer: micromouse-timer_1.2.2_amd64.deb
          - os: windows-latest
            artifact: MicromouseTimer-windows
            archive: MicromouseTimer-windows.zip
            installer: MicromouseTimer-Setup-Windows.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: microtimer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean packaging/MicromouseTimer.spec
      - name: Package Linux folder
        if: runner.os == 'Linux'
        run: tar -czf dist/MicromouseTimer-linux.tar.gz -C dist MicromouseTimer
      - name: Build Linux installer
        if: runner.os == 'Linux'
        run: python packaging/build_deb.py
      - name: Package Windows folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MicromouseTimer -DestinationPath dist/MicromouseTimer-windows.zip
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $compiler = @("$programFilesX86\Inno Setup 7\ISCC.exe", "$programFilesX86\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $compiler) { throw "Inno Setup compiler was not found" }
          & $compiler packaging/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            microtimer/dist/${{ matrix.archive }}
            microtimer/dist/${{ matrix.installer }}
          if-no-files-found: error
